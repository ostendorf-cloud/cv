extends: default

ignore:
  # Helm template files use Go template syntax ({{ }}), which is not valid
  # plain YAML; values.yaml, Chart.yaml and values.schema.json stay linted.
  - charts/*/templates/
  # A deliberately broken fixture internal/cv's own tests parse, proving the
  # strict decoder rejects malformed input; yamllint would otherwise fail on
  # the exact syntax error that test exists to catch. The other fixtures
  # under internal/cv/testdata/invalid/ are valid YAML and stay linted.
  - internal/cv/testdata/invalid/malformed-yaml.yaml
  # Stale worktrees from other parallel sessions on this repository; never
  # this repository's own files.
  - .claude/worktrees/

rules:
  line-length:
    max: 140
  document-start: disable
  truthy:
    allowed-values: ["true", "false", "on"]

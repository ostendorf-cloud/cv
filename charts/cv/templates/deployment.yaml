apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cv.fullname" . }}
  labels:
    {{- include "cv.labels" . | nindent 4 }}
spec:
  {{/*
  Ingress and httpRoute are mutually exclusive: both pick an external route
  for the same hostname, and only one may be the deployment's actual front
  door. The guard lives here, not duplicated into templates/ingress.yaml and
  templates/httproute.yaml, because this template always renders regardless
  of which routing flag is set (or neither), so the check fires exactly
  once, deterministically.
  */}}
  {{- if and .Values.ingress.enabled .Values.httpRoute.enabled }}
  {{ fail "ingress.enabled and httpRoute.enabled cannot both be true: pick one external route and turn the other off." }}
  {{- end }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cv.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cv.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "cv.serviceAccountName" . }}
      # cvd makes no Kubernetes API calls of its own; see
      # templates/serviceaccount.yaml and values.yaml. Set on the pod too,
      # not only the ServiceAccount, since the pod spec's own value would
      # otherwise win if it were ever left unset here.
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: admin
              containerPort: {{ .Values.service.adminPort }}
              protocol: TCP
          env:
            - name: ADDR
              value: {{ .Values.config.addr | quote }}
            - name: ADMIN_ADDR
              value: {{ .Values.config.adminAddr | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: DATA_DIR
              value: {{ .Values.config.dataDir | quote }}
          {{- if .Values.data.existingConfigMap }}
          volumeMounts:
            - name: cv-data
              mountPath: {{ .Values.config.dataDir | quote }}
              readOnly: true
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.data.existingConfigMap }}
      volumes:
        - name: cv-data
          configMap:
            name: {{ .Values.data.existingConfigMap | quote }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

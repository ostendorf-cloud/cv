# Every tool this repository needs, pinned. CI installs from this same file through
# mise-action, so local and CI run identical versions. Nothing is installed any other way.
[tools]
go = "1.27.4"
task = "3"
# Pinned to the patch, not "2": a golangci-lint release is built against one Go patch and
# cannot read the stdlib export data of a newer one, so the two versions move together.
golangci-lint = "2.15.0"
actionlint = "1"
markdownlint-cli2 = "0.24.2"
yamllint = "1"
gitleaks = "8"
hadolint = "2"
# scripts/ holds the image smoke test, so the shell gets the same treatment as
# every other language here: a linter and a formatter, both pinned.
shellcheck = "0.11"
shfmt = "3"
goreleaser = "2"
# Renders the PDFs: `cv render pdf` shells out to `typst compile`. Pinned to the patch, like
# golangci-lint, so a typesetting change never arrives unannounced: Renovate proposes bumps.
# mise.lock holds the sha256 of the linux archives (x64 and arm64), the asset digests GitHub's
# release API reports for v0.14.2, and mise refuses an archive that does not match. On a bump,
# copy the new digests from the release page into mise.lock by hand, never computed from a
# download. TestTypstLockMatchesMisePin in cmd/cv fails while the two versions differ.
typst = "0.14.2"
# pdftotext and pdfinfo: the PDF tests read the text layer the way an applicant tracking system
# does, and scripts/check-pdf-pages.sh counts the pages. The registry maps poppler to conda.
poppler = "26.11.0"
# Pinned to the 3.x line, not 4.x: the helm-unittest plugin used to verify
# charts/cv targets Helm 3's plugin API.
helm = "4.3.2"
kubeconform = "0.8.0"

# helm-unittest (charts/cv's own verification plugin) is a Helm plugin, not a
# conventional CLI, and the baseline forbids "helm plugin install <url>" regardless of Helm
# version, so it is pinned through mise's generic "github:" backend instead. mise downloads and
# checksums the one release asset built for the current OS and architecture, and "postinstall"
# then copies that directory straight into Helm's own plugin folder, never through Helm's own
# installer, so there is nothing left for Helm to ask to verify. "rename_exe" undoes mise's own
# default of stripping the OS/arch suffix off a single-binary download, which plugin.yaml needs
# kept to find the right binary by name.
[tools."github:helm-unittest/helm-unittest"]
version = "1.2.1"
depends = ["helm"]
postinstall = "rm -rf \"$(helm env HELM_PLUGINS)/helm-unittest\" && mkdir -p \"$(helm env HELM_PLUGINS)\" && cp -r \"$MISE_TOOL_INSTALL_PATH\" \"$(helm env HELM_PLUGINS)/helm-unittest\""

[tools."github:helm-unittest/helm-unittest".platforms]
linux-x64 = { rename_exe = "untt-linux-amd64" }
macos-arm64 = { rename_exe = "untt-macos-arm64" }

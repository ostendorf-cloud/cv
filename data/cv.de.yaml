experience:
  - id: stackmeister-devops-cloud-engineer
    employer: Stackmeister
    title: DevOps- und Cloud-Engineer
    start: "2026-03"
    summary: >
      Plattformaufbau, Entwicklung und vor allem DevOps, Cloud-Migration und Beratung für unterschiedliche Kunden. In
      meinen Projekten baue und betreibe ich Plattformen wie eine OpenStack-Plattform mit Kolla-Ansible und Ansible,
      erstelle Proofs of Concept wie für OpenStack Magnum mit Cluster API und migriere VMware-Rechenzentren mit OpenTofu
      und Ansible in OpenStack-basierte Clouds.
    location: Remote
    employment_type: Vollzeit
  - id: self-employed-event-technician

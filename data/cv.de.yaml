projects:
  - id: cv
    github_repo: ostendorf-cloud/cv
    description: >
      Die eine Quelle für diesen Lebenslauf: eine CLI, die ihn validiert und rendert, und ein Dienst, der ihn ausliefert.
  - id: govue
    github_repo: ostendorf-cloud/govue
    description: >
      Bibliothek für Webanwendungen mit Go-Backend und Vue-Frontend: HTTP-Server-Schicht mit Timeouts, Security-Headern,
      Health-Endpunkten, Sessions, OIDC-Login, CSRF-Schutz, Rate Limiting und Prometheus-Metriken sowie ein Vue-Paket mit
      Komponenten und Design-Token-Vertrag.
  - id: release-me
    github_repo: ostendorf-cloud/release-me
    description: >
      Release-Automatisierung für Repositories mit Merge-Commits: ein Changelog-Eintrag je Pull Request, Versionen aus
      Conventional Commits, Release-Pull-Request, Tag und Release.
  - id: gitcd
    github_repo: ostendorf-cloud/gitcd
    description: >
      Klont Repositories in ein vorhersagbares Pfadlayout, wendet je Remote ein Git-Identitätsprofil an und springt aus der
      Shell zu jedem Repository.
  - id: skills
    github_repo: ostendorf-cloud/skills
    description: >
      Regeln, Skills, Hooks und Einstellungen für Coding-Agenten, zuerst für Claude Code und für jeden Agenten, der
      AGENTS.md liest.
  - id: workflows
    github_repo: ostendorf-cloud/workflows
    description: >
      Gemeinsame, wiederverwendbare GitHub-Actions-Workflows der Organisation ostendorf-cloud.
  - id: qarr
    github_repo: ostendorf-cloud/qarr
    description: >
      QR-Codes mit eigenem Inhalt, eigenen Farben und Logo, im Browser erzeugt.
  - id: burnlink
    github_repo: ostendorf-cloud/burnlink
    description: >
      Geheimnisse einmalig teilen: Der Browser verschlüsselt, der Server gibt den Inhalt genau einmal heraus und kennt nie
      einen Schlüssel.
  - id: wishlist
    github_repo: ostendorf-cloud/wishlist
    description: >
      Geteilte Wunschlisten mit Reservierungen, die der Besitzer nie sieht. Go-Dienst mit Vue-3-Single-Page-Application auf
      govue.
  - id: calbridge
    github_repo: ostendorf-cloud/calbridge
    description: >
      Selektives Spiegeln von Kalendern zwischen Google Calendar, Microsoft 365 und iCloud, ein Detailgrad je Verbindung.
  - id: solobill
    github_repo: ostendorf-cloud/solobill
    description: >
      Buchhaltung für Einzelunternehmer: Angebote, Rechnungen, Ausgaben, EÜR und die Zahlen für Elster. Go-API und
      Vue-Anwendung auf govue mit Postgres, im Aufbau.
  - id: homebrew-tap
    github_repo: ostendorf-cloud/homebrew-tap
    description: >
      Homebrew-Formeln für die Werkzeuge von ostendorf-cloud.
  - id: ostendorf-dev
    github_repo: ostendorf-cloud/ostendorf.dev
    description: >
      Die Entwickler-Website von Simon Ostendorf: Projekte, Fähigkeiten und Kontakt. Go-Dienst mit Vue-3-Anwendung auf govue.
  - id: ostendorf-tech
    github_repo: ostendorf-cloud/ostendorf.tech
    description: >
      Die Geschäfts-Website von Simon Ostendorf Veranstaltungstechnik: deutsch und englisch, mit hellem und dunklem Design,
      zur Bauzeit vorgerendert.
  - id: simon-ostendorf-de
    github_repo: ostendorf-cloud/simon-ostendorf.de
    description: >
      Die persönliche Startseite von Simon Ostendorf mit dem Weg zur Softwareentwicklung oder Veranstaltungstechnik und dem
      Lebenslauf.


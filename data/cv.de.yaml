engagements:
  - id: openstack-private-cloud-platform
    experience: stackmeister-devops-cloud-engineer
    title: Plattformaufbau und -betrieb einer OpenStack Private Cloud im öffentlichen Sektor
    industry: Öffentlicher Sektor
    start: "2026"
    summary: >
      Aufbau und Betrieb einer OpenStack-basierten Private-Cloud-Plattform, die Compute, Storage
      und Netzwerk für Verwaltungsanwendungen bereitstellt. Deployment, Konfiguration und Updates
      sind mit Kolla-Ansible und Ansible automatisiert und in Git versioniert, ergänzt um
      CI/CD-Pipelines. Zur Arbeit gehören Härtung der Basissysteme, Netzwerk-, Storage- und
      Mandantenkonzepte, Monitoring, Patch-Management und Upgrades. Dazu kommen Betriebshandbücher
      und die Abstimmung mit Fachabteilungen, Betrieb und Security-Verantwortlichen.
  - id: magnum-kubernetes-poc
    experience: stackmeister-devops-cloud-engineer
    title: Proof of Concept für Kubernetes as a Service auf OpenStack
    industry: Öffentlicher Sektor
    start: "2026"
    end: "2026"
    summary: >
      Proof of Concept für OpenStack Magnum mit Cluster API in einer bestehenden, mit
      Kolla-Ansible betriebenen OpenStack-Umgebung. Installation und Anpassung von Magnum samt
      Abhängigkeiten, danach Bereitstellung eines Testclusters über ein Cluster-Template mit einer
      Beispielanwendung. Das Kundenteam wurde zu Installation, Konfiguration und Anpassung
      geschult. Ergebnis war eine dokumentierte Entscheidungsvorlage zur Wahl eines passenden
      Cluster-API-Providers.
  - id: vmware-migration-public-sector
    experience: stackmeister-devops-cloud-engineer
    title: Migration einer virtualisierten Bestandsumgebung in eine OpenStack-Cloud im öffentlichen Sektor
    industry: Öffentlicher Sektor
    start: "2026"
    end: "2026"
    summary: >
      Ablösung eines VMware-Rechenzentrums durch Migration in eine OpenStack-basierte
      Cloud-Umgebung. Die Fachverfahren und Basisdienste wurden spezifiziert und dokumentiert,
      ihre Infrastruktur mit OpenTofu aufgebaut und die Softwarebereitstellung mit Ansible
      automatisiert. Dazu kamen Architekturentscheidungen zu Netzwerk und Cloud, die Einbindung in
      Monitoring und Backup, Betriebshandbücher und das Enablement der Mitarbeitenden.
  - id: vmware-migration-sovereign-cloud
    experience: stackmeister-devops-cloud-engineer
    title: Migration einer VMware-Umgebung in eine souveräne OpenStack-Cloud
    industry: Verbands- und Organisationsumfeld
    start: "2026"
    end: "2026"
    summary: >
      Ablösung eines VMware-Rechenzentrums durch Migration der Anwendungen und
      Infrastrukturdienste in eine OpenStack-basierte Cloud. Nach Inventarisierung und
      Abhängigkeitsanalyse wurden wiederverwendbare OpenTofu-Module für Compute, Storage, Netzwerk
      und Security erstellt und Ansible-Playbooks für Konfiguration und Härtung der VMs entwickelt.
      CI/CD-Pipelines automatisieren die Infrastrukturbereitstellung, Funktions-, Integrations-
      und Migrationstests begleiteten die Umstellung. Migrationsabläufe und Wartungsfenster wurden
      mit dem Kunden und externen Dienstleistern abgestimmt und in Migrationskonzepten, ADRs und
      Betriebsanleitungen dokumentiert.
  - id: kubernetes-self-service-automation
    experience: cancom-working-student
    title: Ende-zu-Ende-Automatisierung von Kubernetes-Clustern im Self-Service
    industry: IT-Dienstleistung
    start: "2023"
    end: "2026"
    summary: >
      Entwicklung einer automatisierten Plattform, über die Kunden Kubernetes-Cluster im
      Self-Service über ein Cloud-Portal anlegen. Provisionierung und Konfiguration laufen Ende zu
      Ende über Terraform/OpenTofu und Cluster API, das Portal selbst gehörte nicht zum Umfang.
      Jeder Cluster erhält einen standardisierten Add-on-Stack und wird in das zentrale Monitoring
      eingebunden, Grafana-Dashboards zeigen die Auslastung.
  - id: cluster-api-provider-openstack
    experience: cancom-working-student
    title: Weiterentwicklung des Cluster API Providers für OpenStack
    industry: IT-Dienstleistung
    start: "2024"
    end: "2025"
    summary: >
      Wartung und Weiterentwicklung des Cluster API Providers für OpenStack für die automatisierte
      Bereitstellung von Kubernetes-Clustern. Umgesetzt wurden Bugfixes für die eingesetzte
      OpenStack-Version sowie neue Funktionen rund um Load-Balancer, Netzwerk und das Löschen von
      Nodes, jeweils mit Go-Unit-Tests. Die Änderungen wurden upstream eingereicht und laufend auf
      neue Upstream-Versionen rebased, Provider-Updates wurden vorbereitet und dokumentiert.
  - id: kubelet-credential-provider
    experience: cancom-working-student
    title: Entwicklung eines Kubelet Credential Providers
    industry: IT-Dienstleistung
    start: "2025"
    end: "2025"
    summary: >
      Anforderungsanalyse und Entwicklung eines Kubelet Credential Providers in Go auf Basis neuer
      Kubernetes-Funktionen für Credential Provider. Für die Tests entstand eine eigene Umgebung
      aus Kubernetes-Cluster, Vault und Harbor Registry.


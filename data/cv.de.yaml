projects:
  - id: cv
    github_repo: ostendorf-cloud/cv
    description: >
      Die eine Quelle für diesen Lebenslauf: eine CLI, die ihn validiert und rendert, und ein Dienst, der ihn ausliefert.
  - id: govue
    github_repo: ostendorf-cloud/govue
    description: >
      Bibliothek für Webanwendungen mit Go-Backend und Vue-Frontend: HTTP-Server-Schicht mit Timeouts, Security-Headern,
      Health-Endpunkten, Sessions, OIDC-Login, CSRF-Schutz, Rate Limiting und Prometheus-Metriken sowie ein Vue-Paket mit
      Komponenten und Design-Token-Vertrag.
  - id: release-me

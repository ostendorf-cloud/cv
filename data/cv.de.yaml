# Platzhalterdaten. Jeder Eintrag in dieser Datei ist ein Beispiel, keine
# Tatsache aus dem Werdegang von Simon Ostendorf. Er steht nur für den
# echten Eintrag, der ihn ersetzen wird, und zeigt, welche Felder jeder
# Abschnitt erwartet. ids sind mit data/cv.en.yaml geteilt: wer einen
# Eintrag hinzufügt, entfernt oder umbenennt, hält beide Dateien auf dem
# gleichen Stand, sonst meldet `cv validate` die Abweichung.
experience:
  - id: example-experience-1
    employer: Example Employer GmbH
    title: Platzhaltertitel
    start: "2020-01"
    end: null
    visibility: public
    summary: >
      Platzhaltertext für die Tätigkeitsbeschreibung dieses Eintrags.

education:
  - id: example-education-1
    institution: Example University
    degree: Platzhalterabschluss
    start: "2015-10"
    end: "2019-06"
    visibility: public
    summary: >
      Platzhaltertext für die Beschreibung dieses Bildungswegs.

certificates:
  - id: example-certificate-1
    name: Platzhalterzertifikat
    issuer: Example Certification Body
    issued: "2023-01"
    valid_until: "2026-01"
    visibility: public

skills:
  - id: example-skill-1
    name: Platzhalterfähigkeit
    level: working
    visibility: public
    evidence:
      - type: experience
        ref: example-experience-1
      - type: certificate
        ref: example-certificate-1
      - type: project
        ref: example-project-1

projects:
  - id: example-project-1
    github_repo: ostendorf-cloud/example-project
    description: >
      Platzhaltertext für die Projektbeschreibung dieses Eintrags.
    visibility: public

references:
  - id: example-reference-1
    name: Platzhaltername
    role: Platzhalterrolle
    visibility: cv-only

languages:
  - id: german
    name: Deutsch
    level: expert
    visibility: public
  - id: english
    name: Englisch
    level: working
    visibility: public

contact:
  email: contact@example.com
  address:
    visibility: cv-only
    street: Platzhalterstraße 1
    city: Platzhalterstadt
  profiles:
    - id: github
      platform: GitHub
      url: https://github.com/example
      visibility: public

engagements:
  - id: openstack-private-cloud-platform
    experience: stackmeister-devops-cloud-engineer
    title: Building and running an OpenStack private cloud platform in the public sector
    industry: Public sector
    start: "2026"
    summary: >
      Building and running an OpenStack based private cloud platform that provides compute,
      storage and networking for administrative applications. Deployment, configuration and
      updates are automated with Kolla-Ansible and Ansible, versioned in Git and backed by CI/CD
      pipelines. The work covers hardening of the base systems, network, storage and tenancy
      concepts, monitoring, patch management and upgrades. It also includes operations handbooks
      and coordination with business units, operations and security staff.
  - id: magnum-kubernetes-poc
    experience: stackmeister-devops-cloud-engineer
    title: Proof of concept for Kubernetes as a service on OpenStack
    industry: Public sector
    start: "2026"
    end: "2026"
    summary: >
      Proof of concept for OpenStack Magnum with Cluster API in an existing OpenStack environment
      run with Kolla-Ansible. Installed and customised Magnum and its dependencies, then
      provisioned a test cluster from a cluster template with a sample application. Trained the
      client team on installation, configuration and customisation. Delivered documentation and a
      decision paper for choosing a suitable Cluster API provider.
  - id: vmware-migration-public-sector
    experience: stackmeister-devops-cloud-engineer
    title: Migration of a virtualised legacy environment into an OpenStack cloud in the public sector
    industry: Public sector
    start: "2026"
    end: "2026"
    summary: >
      Replaced a VMware data centre by migrating it into an OpenStack based cloud environment.
      Specified and documented the business applications and base services, built their
      infrastructure with OpenTofu and automated software delivery with Ansible. Also covered
      network and cloud architecture decisions, integration into monitoring and backup, operations
      handbooks and enablement of the client's staff.
  - id: vmware-migration-sovereign-cloud
    experience: stackmeister-devops-cloud-engineer
    title: Migration of a VMware environment into a sovereign OpenStack cloud
    industry: Associations and organisations
    start: "2026"
    end: "2026"
    summary: >
      Replaced a VMware data centre by migrating applications and infrastructure services into an
      OpenStack based cloud. After inventory and dependency analysis, built reusable OpenTofu
      modules for compute, storage, network and security resources and Ansible playbooks to
      configure and harden the VMs. CI/CD pipelines automate infrastructure provisioning, and
      functional, integration and migration tests accompanied the cutover. Coordinated migration
      runs and maintenance windows with the client and external service providers, documented in
      migration concepts, ADRs and operations guides.
  - id: kubernetes-self-service-automation
    experience: cancom-working-student
    title: End to end automation of self-service Kubernetes clusters
    industry: IT services
    start: "2023"
    end: "2026"
    summary: >
      Built an automated platform that lets customers create Kubernetes clusters self-service
      through a cloud portal. Provisioning and configuration run end to end on Terraform/OpenTofu
      and Cluster API, the portal itself was out of scope. Every cluster gets a standard add-on
      stack and joins central monitoring, with Grafana dashboards for utilisation.
  - id: cluster-api-provider-openstack
    experience: cancom-working-student
    title: Development of the Cluster API provider for OpenStack
    industry: IT services
    start: "2024"
    end: "2025"
    summary: >
      Maintained and extended the Cluster API provider for OpenStack used for automated Kubernetes
      cluster provisioning. Delivered bug fixes for the OpenStack version in use and new features
      around load balancers, networking and node deletion, each with Go unit tests. Submitted the
      changes upstream, rebased them continuously on new upstream releases and prepared and
      documented provider updates.
  - id: kubelet-credential-provider
    experience: cancom-working-student
    title: Development of a kubelet credential provider
    industry: IT services
    start: "2025"
    end: "2025"
    summary: >
      Analysed the requirements for and developed a kubelet credential provider in Go, built on
      new Kubernetes features for credential providers. Set up a dedicated test environment with a
      Kubernetes cluster, Vault and a Harbor registry.


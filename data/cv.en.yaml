projects:
  - id: cv
    github_repo: ostendorf-cloud/cv
    description: >
      The one source for this CV: a CLI that validates and renders it, and a service that serves it.
  - id: govue
    github_repo: ostendorf-cloud/govue
    description: >
      A library for web applications with a Go backend and a Vue frontend: an HTTP server layer with timeouts, security
      headers, health endpoints, sessions, OIDC login, CSRF protection, rate limiting and Prometheus metrics, plus a Vue
      package with components and a design token contract.
  - id: release-me
    github_repo: ostendorf-cloud/release-me
    description: >
      Release automation for repositories that merge with merge commits: one changelog entry per pull request, versions from
      Conventional Commits, a release pull request, a tag and a release.
  - id: gitcd
    github_repo: ostendorf-cloud/gitcd
    description: >
      Clones repositories into a predictable path layout, applies a git identity profile per remote and jumps to any of them
      from the shell.
  - id: skills
    github_repo: ostendorf-cloud/skills
    description: >
      Rules, skills, hooks and settings for coding agents, Claude Code first, then every agent that reads AGENTS.md.
  - id: workflows

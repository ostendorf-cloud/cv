name: release

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled, unlabeled]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    # The label list is release-me.yaml's defaults, spelled out: the condition
    # cannot read the configuration.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release-me/') &&
      contains(
        fromJSON('["release: pending", "release: tagged", "release: alpha", "release: beta", "release: rc"]'),
        github.event.label.name
      ))
    steps:
      - name: Mint a release app token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc  # v3.4.0
        with:
          app-id: ${{ vars.GH_APP_RELEASE_APP_ID }}
          private-key: ${{ secrets.GH_APP_RELEASE_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          # A label event checks out the base branch, never the merge ref.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.sha }}
          fetch-depth: 0

      # release-me.yaml sets github-release-draft-until-assets-attach: true,
      # so the release is a draft, and publishing it is on this same job: a
      # draft fires no "release" webhook, so a second workflow would never
      # run. The publish step below un-drafts it with the app token, which
      # fires the "published" event publish.yaml's image and chart jobs wait
      # on. See release-me's docs/adr/0001-draft-releases-until-assets-attach.md.
      - name: Tag and draft a release for every merged release pull request
        id: release-me
        uses: ostendorf-cloud/release-me/action@e3346c4a5aa463642e8d0627b01b3308dc49e2ec  # v0.5.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
        if: steps.release-me.outputs.tags != ''
        with:
          install_args: go goreleaser task

      # Renders the JSON documents, which fails on invalid data and leaves the
      # draft unpublished, builds the archives, attaches everything and
      # publishes.
      - name: Render, build, attach and publish the assets for every tag just released
        if: steps.release-me.outputs.tags != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          TAGS: ${{ steps.release-me.outputs.tags }}
        run: ./scripts/publish-release-assets.sh

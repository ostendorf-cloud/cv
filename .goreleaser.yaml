# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: cv

builds:
  - id: cv
    main: ./cmd/cv
    binary: cv
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - arm64
      - amd64
    ldflags:
      - -s -w -X main.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

# release-me owns the tag, the release and its notes. goreleaser only attaches
# the assets to the release that already exists for the tag.
release:
  mode: keep-existing
  prerelease: auto
  # `task render:json` writes both documents here ahead of goreleaser. The
  # directory is not dist/, which `goreleaser --clean` empties. The file names
  # are a contract with the consumer sites: see README.md.
  extra_files:
    - glob: rendered/cv.de.json
    - glob: rendered/cv.en.json

changelog:
  disable: true
